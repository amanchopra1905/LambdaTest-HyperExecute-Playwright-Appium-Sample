version: "0.2"
runson: android

autosplit: true
concurrency: 2

runtime:
  language: node
  version: "18"

pre:
  - npm install
  - npx playwright install

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

framework:
  name: appium
  args:
    playwrightRD : true
    region: us

testDiscovery:
  command: cat pw_androidtests.txt
  mode: static
  type: raw

testRunnerCommand: npm run test-android --verbose

jobLabel: [ 'HYP', 'Playwright-RD', 'Android']